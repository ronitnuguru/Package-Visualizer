<template>
  <lightning-card>
    <h3 slot="title" class="slds-truncate">
      <lightning-icon
        icon-name="utility:salesforce1"
        size="medium"
        class="slds-m-right_small card_header_icon"
      ></lightning-icon>
      Headless Toolkit Showcase
    </h3>
    <lightning-button-group slot="actions">
      <lightning-button-icon
        data-id="headless-360-showcase-help"
        icon-name="utility:help_doc_ext"
        variant="brand"
        onclick={navigateToHeadless360ShowcaseHelp}
      ></lightning-button-icon>
    </lightning-button-group>
    <div class="slds-card__body slds-card__body_inner">
      <div class="slds-tabs_scoped">
        <ul
          class="slds-tabs_scoped__nav c-client-tab-nav"
          role="tablist"
          aria-label="AI surfaces"
          onkeydown={handleClientTabKeydown}
        >
          <li class={slackTabClass} role="presentation">
            <button
              class="slds-tabs_scoped__link client-tab"
              type="button"
              role="tab"
              data-tab="slack"
              id="slack-tab"
              aria-controls="slack-panel"
              aria-selected={isSlackTab}
              tabindex={slackTabIndex}
              onclick={handleClientTabClick}
              disabled={provisioningBusy}
            >
              <lightning-icon
                icon-name="standard:slack"
                size="small"
                alternative-text=""
              ></lightning-icon
              ><span>Slack</span>
            </button>
          </li>
          <li class={claudeTabClass} role="presentation">
            <button
              class="slds-tabs_scoped__link client-tab"
              type="button"
              role="tab"
              data-tab="claude"
              id="claude-tab"
              aria-controls="claude-panel"
              aria-selected={isClaudeTab}
              tabindex={claudeTabIndex}
              onclick={handleClientTabClick}
              disabled={provisioningBusy}
            >
              <svg
                class="client-icon"
                fill="#D97757"
                aria-hidden="true"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"
                /></svg
              ><span>Claude</span>
            </button>
          </li>
          <li class={chatgptTabClass} role="presentation">
            <button
              class="slds-tabs_scoped__link client-tab"
              type="button"
              role="tab"
              data-tab="chatgpt"
              id="chatgpt-tab"
              aria-controls="chatgpt-panel"
              aria-selected={isChatgptTab}
              tabindex={chatgptTabIndex}
              onclick={handleClientTabClick}
              disabled={provisioningBusy}
            >
              <svg
                class="client-icon openai-icon"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid"
                viewBox="0 0 256 260"
              >
                <path
                  fill="#fff"
                  d="M239.184 106.203a64.716 64.716 0 0 0-5.576-53.103C219.452 28.459 191 15.784 163.213 21.74A65.586 65.586 0 0 0 52.096 45.22a64.716 64.716 0 0 0-43.23 31.36c-14.31 24.602-11.061 55.634 8.033 76.74a64.665 64.665 0 0 0 5.525 53.102c14.174 24.65 42.644 37.324 70.446 31.36a64.72 64.72 0 0 0 48.754 21.744c28.481.025 53.714-18.361 62.414-45.481a64.767 64.767 0 0 0 43.229-31.36c14.137-24.558 10.875-55.423-8.083-76.483Zm-97.56 136.338a48.397 48.397 0 0 1-31.105-11.255l1.535-.87 51.67-29.825a8.595 8.595 0 0 0 4.247-7.367v-72.85l21.845 12.636c.218.111.37.32.409.563v60.367c-.056 26.818-21.783 48.545-48.601 48.601Zm-104.466-44.61a48.345 48.345 0 0 1-5.781-32.589l1.534.921 51.722 29.826a8.339 8.339 0 0 0 8.441 0l63.181-36.425v25.221a.87.87 0 0 1-.358.665l-52.335 30.184c-23.257 13.398-52.97 5.431-66.404-17.803ZM23.549 85.38a48.499 48.499 0 0 1 25.58-21.333v61.39a8.288 8.288 0 0 0 4.195 7.316l62.874 36.272-21.845 12.636a.819.819 0 0 1-.767 0L41.353 151.53c-23.211-13.454-31.171-43.144-17.804-66.405v.256Zm179.466 41.695-63.08-36.63L161.73 77.86a.819.819 0 0 1 .768 0l52.233 30.184a48.6 48.6 0 0 1-7.316 87.635v-61.391a8.544 8.544 0 0 0-4.4-7.213Zm21.742-32.69-1.535-.922-51.619-30.081a8.39 8.39 0 0 0-8.492 0L99.98 99.808V74.587a.716.716 0 0 1 .307-.665l52.233-30.133a48.652 48.652 0 0 1 72.236 50.391v.205ZM88.061 139.097l-21.845-12.585a.87.87 0 0 1-.41-.614V65.685a48.652 48.652 0 0 1 79.757-37.346l-1.535.87-51.67 29.825a8.595 8.595 0 0 0-4.246 7.367l-.051 72.697Zm11.868-25.58 28.138-16.217 28.188 16.218v32.434l-28.086 16.218-28.188-16.218-.052-32.434Z"
                /></svg
              ><span>ChatGPT</span>
            </button>
          </li>
          <li class={cursorTabClass} role="presentation">
            <button
              class="slds-tabs_scoped__link client-tab"
              type="button"
              role="tab"
              data-tab="cursor"
              id="cursor-tab"
              aria-controls="cursor-panel"
              aria-selected={isCursorTab}
              tabindex={cursorTabIndex}
              onclick={handleClientTabClick}
              disabled={provisioningBusy}
            >
              <svg
                class="client-icon cursor-icon"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 466.73 532.09"
              >
                <path
                  d="M457.43 125.94 244.42 2.96a22.13 22.13 0 0 0-22.12 0L9.3 125.94C3.55 129.26 0 135.4 0 142.05v247.99c0 6.65 3.55 12.79 9.3 16.11l213.01 122.98a22.13 22.13 0 0 0 22.12 0l213.01-122.98c5.75-3.32 9.3-9.46 9.3-16.11V142.05c0-6.65-3.55-12.79-9.3-16.11zm-13.38 26.05L238.42 508.15c-1.39 2.4-5.06 1.42-5.06-1.36V273.58c0-4.66-2.49-8.97-6.53-11.31L24.87 145.67c-2.4-1.39-1.42-5.06 1.36-5.06h411.26c5.84 0 9.49 6.33 6.57 11.39h-.01Z"
                  fill="#edecec"
                /></svg
              ><span>Cursor</span>
            </button>
          </li>
        </ul>
        <div
          class="slds-tabs_scoped__content"
          role="tabpanel"
          id="slack-panel"
          aria-labelledby="slack-tab"
          hidden={hideSlack}
        >
          <div
            class="slds-progress slds-progress_vertical slds-progress_success"
          >
            <ol class="slds-progress__list slds-progress__list-bordered">
              <li class="slds-progress__item" data-id="slack-connection-step">
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                >
                  <lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon>
                </span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps">
                        Connect Salesforce and Slack
                      </strong>
                      <p class="slds-var-m-top_xx-small">
                        Connect your Slack workspace to this Salesforce org,
                        then approve and activate the connection.
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-group>
                        <lightning-button-icon
                          data-id="slack-workspaces-setup"
                          icon-name="utility:setup"
                          alternative-text="Open Slack Setup"
                          title="Open Slack Setup"
                          onclick={navigateToSlackSetup}
                          tooltip="Manage Slack Connection"
                        ></lightning-button-icon>
                        <lightning-button-icon
                          data-id="slack-connection-help"
                          icon-name="utility:help_doc_ext"
                          alternative-text="Open Connect Salesforce and Slack documentation"
                          title="Open Connect Salesforce and Slack documentation"
                          variant="brand"
                          onclick={navigateToSlackConnectionHelp}
                        ></lightning-button-icon>
                      </lightning-button-group>
                    </div>
                  </div>
                </div>
              </li>
              <li class="slds-progress__item" data-id="custom-mcp-server-step">
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                >
                  <lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon>
                </span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps">
                        Create and Curate a Custom MCP Server
                      </strong>
                      <p class="slds-var-m-top_xx-small">
                        Create a Custom Salesforce Hosted MCP Server and add a
                        combination of server assets and tools that Slackbot can
                        use.
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-group>
                        <lightning-button-icon
                          data-id="custom-mcp-servers-help"
                          icon-name="utility:help_doc_ext"
                          alternative-text="Open Custom MCP Servers documentation"
                          title="Open Custom MCP Servers documentation"
                          variant="brand"
                          onclick={navigateToCustomMcpServersHelp}
                        ></lightning-button-icon>
                      </lightning-button-group>
                    </div>
                  </div>
                  <div class="slds-var-m-top_small">
                    <!-- Legacy self-service asset tabs retained for reference.
<lightning-tabset data-id="mcp-tool-tabs" variant="scoped">
                      <lightning-tab label="Apex" icon-name="standard:apex">
                        <div class="">
                          <lightning-datatable
                            data-id="apex-tools"
                            key-field="apiName"
                            data={apexTools}
                            columns={apexToolColumns}
                            hide-checkbox-column
                          ></lightning-datatable>
                        </div>
                      </lightning-tab>
                      <lightning-tab
                        label="Agents"
                        icon-name="standard:agent_astro"
                      >
                        <div class="">
                          <template lwc:if={isLoadingAgentforceConfiguration}>
                            <lightning-spinner
                              size="medium"
                            ></lightning-spinner>
                          </template>
                          <template lwc:elseif={hasConfiguredAgent}>
                            <lightning-accordion
                              data-id="configured-agent-script"
                              active-section-name={activeAgentScriptSections}
                              allow-multiple-sections-open
                              onsectiontoggle={handleAgentScriptSectionToggle}
                              class="slds-border_top slds-border_right slds-border_bottom slds-border_left c-headless360-agent-script-accordion"
                            >
                              <lightning-accordion-section
                                name={agentScript.id}
                                label={agentScript.label}
                              >
                                <div
                                  class="slds-border_top slds-border_right slds-border_bottom slds-border_left c-headless360-agent-script-card"
                                >
                                  <lightning-card>
                                    <h3
                                      slot="title"
                                      class="slds-truncate"
                                      title={agentScript.label}
                                    >
                                      <lightning-icon
                                        icon-name="standard:code_set"
                                        alternative-text="AgentScript"
                                        size="small"
                                        class="slds-m-right_small"
                                      ></lightning-icon>
                                      {agentScript.label}
                                    </h3>
                                    <lightning-button-group slot="actions">
                                      <lightning-button
                                        data-id="generate-agent-script"
                                        label="Generate"
                                        variant="brand"
                                        icon-name="utility:sparkles"
                                        icon-position="right"
                                        onclick={handleAgentScriptCoach}
                                      ></lightning-button>
                                      <lightning-button-icon
                                        data-id="copy-agent-script"
                                        icon-name="utility:copy"
                                        variant="border-filled"
                                        alternative-text="Copy AgentScript"
                                        tooltip="Copy to Clipboard"
                                        onclick={handleCopyAgentScript}
                                      ></lightning-button-icon>
                                      <lightning-button-icon
                                        data-id="navigate-agentforce-studio"
                                        icon-name="utility:agent_astro"
                                        variant="border-filled"
                                        alternative-text="Navigate to Agentforce Studio"
                                        tooltip="Navigate to Agentforce Studio"
                                        onclick={navigateToAgentforceStudio}
                                      ></lightning-button-icon>
                                    </lightning-button-group>
                                    <div
                                      class="slds-card__body slds-card__body_inner slds-p-around_none"
                                    >
                                      <pre
                                        data-id="agent-script-preview"
                                        class="c-headless360-agent-script-pre slds-scrollable_y"
                                      ><code class="c-headless360-agent-script-code">{agentScript.body}</code></pre>
                                    </div>
                                  </lightning-card>
                                </div>
                              </lightning-accordion-section>
                            </lightning-accordion>
                          </template>
                          <template lwc:else>
                            <div
                              data-id="agent-setup-guidance"
                              class="slds-scoped-notification slds-media slds-media_center slds-theme_info"
                              role="status"
                            >
                              <div class="slds-media__figure">
                                <lightning-icon
                                  icon-name="utility:info"
                                  alternative-text="Information"
                                  size="small"
                                  variant="inverse"
                                ></lightning-icon>
                              </div>
                              <div class="slds-media__body">
                                <p>
                                  No active Agentforce agent is configured. In
                                  AgentExchange Showcase, open the AgentScripts
                                  tab and create the Package Visualizer Agent,
                                  then select it as the Active Employee Agent in
                                  Agentforce Setup.
                                </p>
                              </div>
                            </div>
                          </template>
                        </div>
                      </lightning-tab>
                      [Previously hidden section]
                      <lightning-tab
                        label="Prompt Templates"
                        icon-name="standard:prompt_builder"
                      >
                        <lightning-empty-state
                          data-id="prompt-template-assets-unavailable"
                          title="Server asset not available..."
                          illustration-name="success:new"
                          size="small"
                        >
                          <p slot="description">
                            No packaged Prompt Templates are available to add to
                            this Custom MCP Server.
                          </p>
                          <lightning-button
                            data-id="prompt-template-assets-help"
                            label="Learn More"
                            slot="cta"
                            onclick={navigateToPromptTemplateHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                      <lightning-tab label="Flows" icon-name="standard:flow">
                        <lightning-empty-state
                          data-id="flow-assets-unavailable"
                          title="Server asset not available..."
                          illustration-name="success:new"
                          size="small"
                        >
                          <p slot="description">
                            No packaged Flows are available to add to this
                            Custom MCP Server.
                          </p>
                          <lightning-button
                            data-id="flow-assets-help"
                            label="Learn More"
                            slot="cta"
                            onclick={navigateToFlowHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                      [End hidden section]
                      <lightning-tab
                        label="Salesforce Hosted MCP Servers"
                        icon-name="standard:mcp_server"
                      >
                        <lightning-empty-state
                          data-id="salesforce-hosted-mcp-server-assets-unavailable"
                          title="Server asset not available..."
                          illustration-name="success:new"
                          size="small"
                        >
                          <p slot="description">
                            No packaged Salesforce Hosted MCP Servers are
                            available to add to this Custom MCP Server.
                          </p>
                          <lightning-button
                            data-id="salesforce-hosted-mcp-server-assets-help"
                            label="Learn More"
                            slot="cta"
                            onclick={navigateToStandardServerHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                    </lightning-tabset>
                    -->
                    <template lwc:if={isSlackTab}>
                      <c-package-visualizer-mcp-provisioner
                        initial-snapshot={provisioningSnapshot}
                        initial-load={provisioningLoad}
                        onprovisioningload={handleProvisioningLoad}
                        onprovisioningsnapshot={handleProvisioningSnapshot}
                        onprovisioningchange={handleProvisioningChange}
                        onprovisioningbusychange={handleProvisioningBusyChange}
                      ></c-package-visualizer-mcp-provisioner>
                    </template>
                  </div>
                </div>
              </li>
              <li class="slds-progress__item" data-id="slackbot-mcp-step">
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                >
                  <lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon>
                </span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps">
                        Connect the Custom MCP Server to Slackbot
                      </strong>
                      <p class="slds-var-m-top_xx-small">
                        In Slack administration, add the Salesforce MCP Server,
                        review its tools, and assign member or workspace access.
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-icon
                        data-id="slackbot-mcp-help"
                        icon-name="utility:help_doc_ext"
                        alternative-text="Open Slackbot MCP documentation"
                        title="Open Slackbot MCP documentation"
                        variant="brand"
                        onclick={navigateToSlackbotMcpHelp}
                      ></lightning-button-icon>
                    </div>
                  </div>
                </div>
              </li>
            </ol>
          </div>
        </div>
        <div
          class="slds-tabs_scoped__content"
          role="tabpanel"
          id="claude-panel"
          aria-labelledby="claude-tab"
          hidden={hideClaude}
        >
          <div
            class="slds-progress slds-progress_vertical slds-progress_success"
            data-id="claude-setup-content"
          >
            <ol class="slds-progress__list slds-progress__list-bordered">
              <li class="slds-progress__item">
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                >
                  <lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon>
                </span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps"
                        >Create an External Client App (ECA)</strong
                      >
                      <p class="slds-var-m-top_xx-small">
                        Before AI clients can connect to your Salesforce org
                        through MCP, you need to configure authentication and
                        access. In Setup → External Client App Manager, create a
                        new ECA with the settings below:
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-group>
                        <lightning-button-icon
                          data-id="claude-eca-setup"
                          icon-name="utility:setup"
                          alternative-text="Open External Client App Manager"
                          title="Open External Client App Manager"
                          onclick={navigateToExternalClientApps}
                        ></lightning-button-icon>
                        <lightning-button-icon
                          data-id="claude-eca-security-help"
                          icon-name="utility:policy"
                          alternative-text="Enhance Security for Production"
                          tooltip="Enhance Security for Production"
                          onclick={navigateToEcaSecurityHelp}
                        ></lightning-button-icon>
                        <lightning-button-icon
                          data-id="claude-org-setup-help"
                          icon-name="utility:help_doc_ext"
                          variant="brand"
                          alternative-text="Open org setup documentation"
                          title="Open org setup documentation"
                          onclick={navigateToExternalClientAppHelp}
                        ></lightning-button-icon>
                      </lightning-button-group>
                    </div>
                  </div>

                                class="slds-m-right_small"
                              ></lightning-icon
                              >1. Create ECA
                            </h3>
                            <div class="slds-var-p-horizontal_medium">
                              <p
                                class="slds-var-m-bottom_xx-small slds-text-title_caps"
                              >
                                Basic Information
                              </p>
                              <ul
                                class="slds-list_dotted slds-var-m-left_small"
                              >
                                <li>
                                  Complete the basic information and enable
                                  OAuth under API settings.
                                </li>
                              </ul>
                              <p
                                class="slds-var-m-top_small slds-var-m-bottom_xx-small slds-text-title_caps"
                              >
                                OAuth Settings
                              </p>
                              <ul
                                class="slds-list_dotted slds-var-m-left_small"
                              >
                                <li>
                                  Callback URL: http://localhost:8787/callback.
                                  Some Cursor versions also use
                                  cursor://anysphere.cursor-mcp/oauth/callback;
                                  add both if supported.
                                </li>
                                <li>
                                  OAuth scopes: Access MCP servers
                                  (<code>mcp_api</code>) and Perform requests at
                                  any time (<code>refresh_token</code>).
                                </li>
                                <li>
                                  Under Security, select Issue JSON Web Token
                                  (JWT)-based access tokens for named users;
                                  deselect other options that do not require
                                  Salesforce support to change.
                                </li>
                                <li>Click Create.</li>
                              </ul>
                            </div>
                          </lightning-card>
                        </div>
                      </div>
                      <div
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-bottom_small"
                      >
                        <div
                          class="slds-border_top slds-border_right slds-border_bottom slds-border_left slds-box slds-box_xx-small"
                        >
                          <lightning-card>
                            <h3 slot="title" class="slds-truncate">
                              <lightning-icon
                                icon-name="standard:record_update"
                                size="medium"
                                class="slds-m-right_small"
                              ></lightning-icon
                              >2. Get Consumer Key
                            </h3>
                            <div class="slds-var-p-horizontal_medium">
                              <p
                                class="slds-var-m-bottom_xx-small slds-text-title_caps"
                              >
                                OAuth Settings
                              </p>
                              <ul
                                class="slds-list_dotted slds-var-m-left_small"
                              >
                                <li>
                                  Open Settings, then Consumer Key and Secret
                                  under OAuth Settings, and save the consumer
                                  key for your MCP client.
                                </li>
                              </ul>
                            </div>
                          </lightning-card>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </li>
              <li class="slds-progress__item" data-id="cursor-configure">
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                  ><lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon
                ></span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps"
                        >Configure Cursor</strong
                      >
                      <p class="slds-var-m-top_xx-small">
                        In Cursor Settings, open Tools &amp; MCP and add a new
                        MCP server using the Salesforce server URL and your
                        consumer key.
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-icon
                        data-id="cursor-configure-help"
                        icon-name="utility:help_doc_ext"
                        variant="brand"
                        alternative-text="Open Cursor configuration documentation"
                        title="Open Cursor configuration documentation"
                        onclick={navigateToCursorHelp}
                      ></lightning-button-icon>
                    </div>
                  </div>
                </div>
              </li>
              <li
                class="slds-progress__item"
                data-id="cursor-custom-mcp-server"
              >
                <span
                  class="slds-icon_container slds-icon-utility-success slds-progress__marker"
                >
                  <lightning-icon
                    class="icon-style"
                    icon-name="utility:info_alt"
                    variant="info"
                    size="x-small"
                    alternative-text="Information"
                  ></lightning-icon>
                </span>
                <div class="slds-progress__item_content">
                  <div class="slds-grid slds-grid_align-spread">
                    <div class="slds-col">
                      <strong class="slds-text-title_caps">
                        Create and Curate a Custom MCP Server
                      </strong>
                      <p class="slds-var-m-top_xx-small">
                        Create a Custom Salesforce Hosted MCP Server and add a
                        combination of server assets and tools that Cursor can
                        use.
                      </p>
                    </div>
                    <div class="slds-shrink-none slds-var-m-left_small">
                      <lightning-button-group>
                        <lightning-button-icon
                          data-id="cursor-custom-mcp-servers-help"
                          icon-name="utility:help_doc_ext"
                          alternative-text="Open Custom MCP Servers documentation"
                          title="Open Custom MCP Servers documentation"
                          variant="brand"
                          onclick={navigateToCustomMcpServersHelp}
                        ></lightning-button-icon>
                      </lightning-button-group>
                    </div>
                  </div>
                  <div class="slds-var-m-top_small">
                    <!-- Legacy self-service asset tabs retained for reference.
<lightning-tabset
                      data-id="cursor-mcp-tool-tabs"
                      variant="scoped"
                    >
                      <lightning-tab label="Apex" icon-name="standard:apex">
                        <div class="">
                          <lightning-datatable
                            data-id="cursor-apex-tools"
                            key-field="apiName"
                            data={apexTools}
                            columns={apexToolColumns}
                            hide-checkbox-column
                          ></lightning-datatable>
                        </div>
                      </lightning-tab>
                      [Previously hidden section]
                      <lightning-tab
                        label="Prompt Templates"
                        icon-name="standard:prompt_builder"
                      >
                        <lightning-empty-state

                          title="Server asset not available..."

                          size="small"

                            No packaged Prompt Templates are available to add to

                          </p>
                          <lightning-button

                            label="Learn More"
                            slot="cta"
                            onclick={navigateToPromptTemplateHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                      <lightning-tab label="Flows" icon-name="standard:flow">
                        <lightning-empty-state
                          data-id="cursor-flow-assets-unavailable"
                          title="Server asset not available..."
                          illustration-name="success:new"
                          size="small"
                        >
                          <p slot="description">
                            No packaged Flows are available to add to this
                            Custom MCP Server.
                          </p>
                          <lightning-button
                            data-id="cursor-flow-assets-help"
                            label="Learn More"
                            slot="cta"
                            onclick={navigateToFlowHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                      [End hidden section]
                      <lightning-tab
                        label="Salesforce Hosted MCP Servers"
                        icon-name="standard:mcp_server"
                      >
                        <lightning-empty-state
                          data-id="cursor-salesforce-hosted-mcp-server-assets-unavailable"

                          illustration-name="success:new"
                          size="small"
                        >
                          <p slot="description">
                            No packaged Salesforce Hosted MCP Servers are
                            available to add to this Custom MCP Server.
                          </p>
                          <lightning-button
                            data-id="cursor-salesforce-hosted-mcp-server-assets-help"
                            label="Learn More"
                            slot="cta"
                            onclick={navigateToStandardServerHelp}
                          ></lightning-button>
                        </lightning-empty-state>
                      </lightning-tab>
                    </lightning-tabset>
                    -->
                    <template lwc:if={isCursorTab}>
                      <c-package-visualizer-mcp-provisioner
                        initial-snapshot={provisioningSnapshot}
                        initial-load={provisioningLoad}
                        onprovisioningload={handleProvisioningLoad}
                        onprovisioningsnapshot={handleProvisioningSnapshot}
                        onprovisioningchange={handleProvisioningChange}
                        onprovisioningbusychange={handleProvisioningBusyChange}
                      ></c-package-visualizer-mcp-provisioner>
                    </template>
                  </div>
                </div>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
