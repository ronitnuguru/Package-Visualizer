<template>
  <lightning-modal-header
    class="modal-window"
    label={label}
  ></lightning-modal-header>
  <lightning-modal-body>
    <div class="slds-card">
      <template if:true={displaySpinner}>
        <div class="slds-p-top_xx-large">
          <lightning-spinner
            alternative-text="Loading"
            size="medium"
            variant="brand"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:if={aiResponse}>
        <lightning-formatted-rich-text
          value={aiResponse}
        ></lightning-formatted-rich-text>
      </template>
      <template lwc:elseif={error}>
        <c-agentforce-extension-install-prompt auto-load>
          <lightning-empty-state
            title="Response unavailable"
            illustration-name="noresults:unknown"
          >
            <p slot="description">
              The org-limits summary could not be generated. Review the error
              and try again.
            </p>
          </lightning-empty-state>
        </c-agentforce-extension-install-prompt>
      </template>
    </div>
    <!--
        <lightning-modal-footer>
            <lightning-button label="Close" onclick={handleClose} class="slds-m-left_x-small"></lightning-button>
            <lightning-button variant="brand" icon-position="right" icon-name="utility:sparkles" label="Regenerate" onclick={generateAiResponse} class="slds-m-left_x-small" disabled={enableGenerate}></lightning-button>
          </lightning-modal-footer>
          -->
  </lightning-modal-body>
</template>
