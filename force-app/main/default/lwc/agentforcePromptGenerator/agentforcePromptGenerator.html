<template>
  <lightning-card class="card-style">
    <template if:true={displayExtensionIllustration}>
      <c-agentforce-extension-install-prompt auto-load>
        <lightning-empty-state
          title="Response unavailable"
          illustration-name="noresults:unknown"
        >
          <p slot="description">
            The AI response could not be generated. Review the error
            notification and try again.
          </p>
          <lightning-button
            variant="neutral"
            label="Back"
            slot="cta"
            onclick={handleIllustrationClear}
          >
          </lightning-button>
        </lightning-empty-state>
      </c-agentforce-extension-install-prompt>
    </template>
    <template if:false={displayExtensionIllustration}>
      <h3 slot="title" class="slds-truncate">
        <lightning-icon
          icon-name={titleIcon}
          alternative-text={titleIcon}
          size="medium"
          class="slds-m-right_small"
        ></lightning-icon>
        {titleHeader}
      </h3>
      <lightning-button-group slot="actions">
        <lightning-button-icon
          icon-name="utility:help_doc_ext"
          onclick={navigateToHelpSupportedModels}
          tooltip="Help - Supported Models"
        ></lightning-button-icon>
      </lightning-button-group>
      <div class="slds-card__body slds-card__body_inner">
        <template if:true={displaySpinner}>
          <lightning-spinner
            alternative-text="Loading"
            size="medium"
            variant="brand"
          ></lightning-spinner>
        </template>

        <lightning-combobox
          name="modelProviders"
          label="Model Providers"
          value={providerValue}
          placeholder="Select Model Provider"
          dropdown-alignment="auto"
          options={modelProviderOptions}
          onchange={handleProviderTypeChange}
        ></lightning-combobox>

        <lightning-combobox
          name="models"
          label="Models"
          value={modelsValue}
          placeholder="Select Supported Models"
          dropdown-alignment="auto"
          options={modelsTypeOptions}
          onchange={handleModelsTypeChange}
          field-level-help="A geo-aware model automatically routes your LLM request to a nearby data center based on where your org is provisioned. It offers greater control over data residency, and using nearby data centers minimizes latency"
        ></lightning-combobox>

        <lightning-textarea
          name="prompt"
          label="Prompt"
          placeholder="Ask Agentforce..."
          oninput={handlePromptChange}
          onchange={handlePromptChange}
          value={prompt}
          required
        ></lightning-textarea>

        <template lwc:if={normalizedTemplatePrompts}>
          <template if:true={enableGenerate}>
            <div class="slds-grid slds-wrap">
              <template for:each={normalizedTemplatePrompts} for:item="prompt">
                <lightning-button
                  label={prompt.label}
                  value={prompt.label}
                  key={prompt.label}
                  icon-name={prompt.icon}
                  icon-position="left"
                  class="slds-m-right_x-small slds-m-top_x-small"
                  onclick={handlePromptTemplateInput}
                ></lightning-button>
              </template>
            </div>
          </template>
        </template>

        <template lwc:if={displayResult}>
          <lightning-textarea
            label="Gen AI Response"
            value={response}
            class="text-area-style"
            readonly
          ></lightning-textarea>
        </template>
      </div>
      <div slot="footer" class="slds-clearfix">
        <div class="slds-float_right">
          <lightning-button
            label="Clear"
            onclick={handleClear}
            class="slds-m-left_x-small"
          ></lightning-button>
          <template lwc:if={displayResult}>
            <lightning-button-group class="slds-m-left_x-small">
              <lightning-button-icon
                icon-name="utility:like"
                tooltip="Like"
                variant="border-filled"
                onclick={handleFeedback}
              ></lightning-button-icon>
              <lightning-button-icon
                icon-name="utility:dislike"
                tooltip="Dislike"
                variant="border-filled"
                onclick={handleFeedback}
              ></lightning-button-icon>
              <lightning-button-icon
                icon-name="utility:copy_to_clipboard"
                tooltip="Copy to Clipboard"
                variant="border-filled"
                onclick={handleCopyPaste}
              ></lightning-button-icon>
            </lightning-button-group>
          </template>
          <lightning-button
            variant="brand"
            icon-position="right"
            icon-name="utility:sparkles"
            label="Generate"
            onclick={handleGenerate}
            class="slds-m-left_x-small"
            disabled={enableGenerate}
          ></lightning-button>
        </div>
      </div>
    </template>
  </lightning-card>
</template>
